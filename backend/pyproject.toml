[project]
name = "fluxus"
version = "1.0.3"
description = "Lecteur RSS auto-hébergé avec résumés LLM"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "cryptography>=43",
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "lxml>=5.0",
    "nh3>=0.2",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "youtube-transcript-api>=0.6",
    "anthropic>=0.40",
    "openai>=1.40",
    "python-dateutil>=2.9",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fluxus"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"
testpaths = ["tests"]
