services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fluxus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-fluxus}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${FLUXUS_PG_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fluxus} -d ${POSTGRES_DB:-fluxus}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: fluxus-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://fluxus:change-me@postgres:5432/fluxus}
      FLUXUS_BROWSER_URL: http://browser:3000
      NO_PROXY: browser,postgres,localhost,127.0.0.1
    ports:
      - "${FLUXUS_HTTP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # --noproxy : un proxy d'entreprise injecté par Docker ne doit pas intercepter le test local.
      test: ["CMD", "curl", "-fsS", "--noproxy", "*", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    image: fluxus-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://fluxus:change-me@postgres:5432/fluxus}
      FLUXUS_BROWSER_URL: http://browser:3000
      NO_PROXY: browser,postgres,localhost,127.0.0.1
    command: ["python", "-m", "fluxus.worker"]
    depends_on:
      api:
        condition: service_healthy

  browser:
    build: ./browser
    image: fluxus-browser
    restart: unless-stopped
    init: true
    shm_size: 512m
    mem_limit: 1g
    environment:
      RENDER_TIMEOUT_MS: "25000"

volumes:
  pgdata:
