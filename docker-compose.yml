# Développement : mêmes services que docker-compose.deploy.yml, construits à partir des sources.
#   docker compose up -d --build
# Un service se modifie dans docker-compose.deploy.yml ; ce fichier n'ajoute que la construction
# locale, les noms d'images locaux et le port Postgres publié.
services:
  postgres:
    extends:
      file: docker-compose.deploy.yml
      service: postgres
    ports:
      # Publié sur l'hôte uniquement en local (développement).
      - "127.0.0.1:${FLUXUS_PG_PORT:-5433}:5432"

  api:
    extends:
      file: docker-compose.deploy.yml
      service: api
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: fluxus-app

  worker:
    extends:
      file: docker-compose.deploy.yml
      service: worker
    image: fluxus-app

  backup:
    extends:
      file: docker-compose.deploy.yml
      service: backup
    build:
      context: scripts
      dockerfile: Dockerfile.backup
    image: fluxus-backup

  browser:
    extends:
      file: docker-compose.deploy.yml
      service: browser
    build: ./browser
    image: fluxus-browser

networks:
  internal:
  render:

volumes:
  pgdata:
